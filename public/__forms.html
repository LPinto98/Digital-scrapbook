<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Forms</title></head>
  <body>
    <!-- Hidden skeleton so Netlify detects the JS-rendered contact form at deploy time -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="file" name="attachment1" />
      <input type="file" name="attachment2" />
      <input type="file" name="attachment3" />
    </form>
  </body>
</html>
